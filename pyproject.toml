[project]
name = "hexlet-code"
version = "0.1.0"
description = "Module 2 project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
]

[tool.sonar]
# Required metadata
projectKey="pavelgrebenkov_python-project-50"
organization="pavelgrebenkov"
projectName="python-project-50"
projectVersion="1.0.0"

# Paths to scan
sources="gendiff"
tests="tests"

# Crucial exclusions (millions of lines of dependency code not needed)
exclusions="**/.venv/**,**/__pycache__/**,**/*.pyc"

# Python specifics & Coverage maps
python.version="3.14"
python.coverage.reportPaths="coverage.xml"
sourceEncoding="UTF-8"

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
       
[tool.hatch.build.targets.wheel]
packages = ["gendiff"]
